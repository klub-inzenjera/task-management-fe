name: Build and push image

on:
    workflow_dispatch:
    push:
        branches:
            - "**"
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read

jobs:
    react-app-build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup NodeJS
              uses: actions/setup-node@v4
              with:
                node-version: 18

            - name: Install dependencies
              run: npm install

            - name: Build project
              run: npm run build

    docker-build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GHCR_PAT }}
            
            - name: Build Docker Image
              run: |
                docker build -t ghcr.io/${{ github.repository_owner }}/react-app:latest .

            - name: Push Docker Image
              run: |
                docker push ghcr.io/${{ github.repository_owner }}/react-app:latest
    
    deploy-to-azure:
        runs-on: ubuntu-latest
        needs: [react-app-build, docker-build-and-push]

        steps:
          - name: Checkout Repository
            uses: actions/checkout@v4

          - name: Azure login
            uses: azure/login@v2
            with:
              client-id: ${{ secrets.AZURE_CLIENT_ID }}
              tenant-id: ${{ secrets.AZURE_TENANT_ID }}
              subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
            
          - name: Verify Azure Subscription Access
            run: az account show

          - name: Deploy to Azure Container Apps
            run: |
              az containerapp update \
                --name task-management-fe \
                --resource-group klub-inzenjera \
                --image ghcr.io/${{ github.repository_owner }}/react-app:latest \
    